<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agenda - Agenda Digital</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="cabecalho">

    <div>

        <h1>📅 Agenda Digital</h1>

        <p>
            Reserva do Laboratório
        </p>

    </div>

    <button
        class="botao-sair"
        onclick="sair()">

        Sair

    </button>

</header>


<main class="agenda-container">

    <section class="boas-vindas">

        <h2>
            Olá, <span id="nomeUsuario"></span>! 👋
        </h2>

        <p>
            Escolha uma data e um horário para fazer sua reserva.
        </p>

    </section>


    <section class="calendario">

        <div class="titulo-agenda">

            <button
                class="mes-botao"
                onclick="mesAnterior()">

                ←

            </button>


            <h2 id="mesAno">
                Agosto 2026
            </h2>


            <button
                class="mes-botao"
                onclick="proximoMes()">

                →

            </button>

        </div>


        <div class="dias-semana">

            <span>DOM</span>
            <span>SEG</span>
            <span>TER</span>
            <span>QUA</span>
            <span>QUI</span>
            <span>SEX</span>
            <span>SÁB</span>

        </div>


        <div
            class="dias"
            id="diasCalendario">

        </div>

    </section>


    <section
        class="reserva"
        id="areaReserva">

        <h2>
            🕐 Escolha um horário
        </h2>

        <p id="dataSelecionada">
            Selecione uma data no calendário.
        </p>


        <div class="horarios">

            <button onclick="selecionarHorario(this)">
                07:00 - 08:00
            </button>

            <button onclick="selecionarHorario(this)">
                08:00 - 09:00
            </button>

            <button onclick="selecionarHorario(this)">
                09:00 - 10:00
            </button>

            <button onclick="selecionarHorario(this)">
                10:00 - 11:00
            </button>

            <button onclick="selecionarHorario(this)">
                11:00 - 12:00
            </button>

            <button onclick="selecionarHorario(this)">
                13:00 - 14:00
            </button>

            <button onclick="selecionarHorario(this)">
                14:00 - 15:00
            </button>

            <button onclick="selecionarHorario(this)">
                15:00 - 16:00
            </button>

            <button onclick="selecionarHorario(this)">
                16:00 - 17:00
            </button>

        </div>


        <label for="laboratorio">
            Laboratório
        </label>

        <select id="laboratorio">

            <option value="">
                Selecione o laboratório
            </option>

            <option>
                Laboratório de Informática 1
            </option>

            <option>
                Laboratório de Informática 2
            </option>

        </select>


        <label for="motivo">
            Motivo da reserva
        </label>

        <textarea
            id="motivo"
            placeholder="Digite o motivo da reserva">
        </textarea>


        <button
            class="botao"
            onclick="confirmarReserva()">

            Confirmar reserva

        </button>

    </section>


    <section class="minhas-reservas">

        <h2>
            📋 Minhas reservas
        </h2>

        <div id="listaReservas">

            <p>
                Você ainda não possui reservas.
            </p>

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
