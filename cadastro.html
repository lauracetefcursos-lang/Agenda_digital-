<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Agenda Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pagina-formulario">
        <div class="formulario">
            <div class="icone">
                👤
            </div>
            <h1>Criar conta</h1>
            <p>
                Cadastre-se para acessar a Agenda Digital.
            </p>
            <form id="formCadastro">
                <label for="tipo">
                    Tipo de usuário
                </label>
                <select id="tipo" required>
                    <option value="">
                        Selecione
                    </option>
                    <option value="Aluno">
                        Aluno
                    </option>
                    <option value="Professor">
                        Professor
                    </option>
                </select>
                <label for="nome">
                    Nome completo
                </label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required
                >
                <label for="email">
                    E-mail ou RA
                </label>
                <input
                    type="text"
                    id="email"
                    placeholder="Digite seu e-mail ou RA"
                    required
                >
                <label for="senha">
                    Senha
                </label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    required                >
                <button
                    type="submit"
                    class="botao">
                    Cadastrar
                </button>
            </form>
            <p class="https://docs.google.com/spreadsheets/d/1Vo8jacCjlkYZ18aFZi8QxeaZBC5b63aJ2lu3w_bBenk/edit?gid=0#gid=0">
                Já possui uma conta?
                <a href="login.html">
                    Fazer login
                </a>
            </p>
            <a
                href="index.html"
                class="voltar">
                ← Voltar
            </a>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
